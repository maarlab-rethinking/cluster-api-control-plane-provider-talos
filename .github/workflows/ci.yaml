# Hand-maintained for the maarlab-rethinking fork. NOT generated by kres.
#
# The upstream version of this file was generated by kres (see .kres.yaml) and
# depended on Sidero Labs infrastructure that a fork cannot reach:
#
#   - `runs-on: {group: generic}`, a self-hosted runner group in their org, which
#     in a fork resolves to nothing and leaves every job queued forever;
#   - a remote BuildKit endpoint at buildkit-amd64.ci.svc.cluster.local inside
#     their CI cluster;
#   - pushes to registry.dev.siderolabs.io, their internal registry.
#
# This replacement runs entirely on GitHub-hosted runners and publishes to GHCR
# under this repository's owner. The integration test job is not carried over: it
# needs an AWS account and the e2e harness in hack/test, and upstream disabled it
# too in 9e552e4.
#
# Do NOT run `make rekres`: it regenerates this file from .kres.yaml and would
# restore the Sidero Labs configuration above.

name: ci

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

"on":
  push:
    branches:
      - main
      - release-*
    tags:
      - v*
  pull_request:
    branches:
      - main
      - release-*

env:
  REGISTRY: ghcr.io
  USERNAME: ${{ github.repository_owner }}

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release on a tag
      packages: write # push the image to GHCR
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # version: v7.0.1
        with:
          # the image TAG and the release notes both come from `git describe`,
          # so the full history and all tags have to be present.
          fetch-depth: 0

      - name: set-up-buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # version: v4.4.1
        timeout-minutes: 10

      # Pull requests get a read-only token, so there the image is built for a
      # single platform and left in the build cache rather than pushed.
      #
      # linux/arm64 needs no emulation: the build stage runs on BUILDPLATFORM and
      # the binary stage only switches GOARCH, so both platforms cross-compile.
      - name: set-build-parameters
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "PLATFORM=linux/amd64" >> "$GITHUB_ENV"
            echo "PUSH=false" >> "$GITHUB_ENV"
          else
            echo "PLATFORM=linux/amd64,linux/arm64" >> "$GITHUB_ENV"
            echo "PUSH=true" >> "$GITHUB_ENV"
          fi

      - name: login-to-registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # version: v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: unit-tests
        run: |
          make unit-tests

      - name: all
        run: |
          make all

      - name: check-dirty
        run: |
          make check-dirty

      - name: release-artifacts
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          make release

      - name: checksums
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cd _out
          sha256sum control-plane-talos/*/* > sha256sum.txt
          sha512sum control-plane-talos/*/* > sha512sum.txt

      - name: release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # version: v3.0.3
        with:
          body_path: _out/RELEASE_NOTES.md
          # published by hand after a look at the notes; note that clusterctl and
          # the CAPI operator cannot see draft releases.
          draft: "true"
          files: |-
            _out/control-plane-talos/*/*
            _out/sha*.txt
