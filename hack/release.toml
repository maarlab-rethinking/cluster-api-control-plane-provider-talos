# commit to be tagged for new release
commit = "HEAD"

project_name = "CAPI Control Plane Provider Talos"
github_repo = "maarlab-rethinking/cluster-api-control-plane-provider-talos"
match_deps = "^github.com/(siderolabs/[a-zA-Z0-9-]+)$"

# previous release
previous = "v0.5.13"

pre_release = false

preface = """\
This is the first release of the Maarlab maintenance fork of CACPPT, cut from
upstream v0.5.13 plus the upstream deprecation notice. Sidero Labs stopped
developing the provider in August 2026 in favour of Omni; this fork keeps it
alive for Cluster API deployments of Talos Linux.
"""

[notes]

[notes.talos]
    title = "Talos Linux"
        description = """\
CACPPT updated for Talos 1.13.
"""

[notes.failuredomains]
    title = "Failure Domain Spreading"
        description = """\
Control plane machines are now spread across the cluster failure domains instead of being
placed at random, matching the behavior of the KubeadmControlPlane: a new machine goes to the
failure domain with the fewest up-to-date machines, and scaling down removes a machine from the
domain holding the most, so the spreading is preserved across rolling updates.

Only the failure domains marked for the control plane are used. If the infrastructure provider
marks none of them, all of the cluster failure domains are used instead.
"""
